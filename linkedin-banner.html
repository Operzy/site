<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Operzy LinkedIn Banner Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Cormorant+Garamond:ital,wght@1,700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#F8FAFC',
                        primary: '#0F172A',
                        secondary: '#334155',
                        accent: '#A3E635',
                        border: '#E5E7EB',
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        drama: ['"Cormorant Garamond"', 'serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    },
                    boxShadow: {
                        glass: '0 8px 32px 0 rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #banner {
            width: 1584px;
            height: 396px;
            background-color: #F8FAFC;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        .noise {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.04;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 10;
        }

        .glow-blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: #A3E635;
            filter: blur(100px);
            opacity: 0.15;
            border-radius: 50%;
            top: -100px;
            right: -100px;
            z-index: 0;
        }
        
        .glow-text {
            filter: drop-shadow(0px 8px 24px rgba(163,230,53,0.3));
        }

        .profile-safe-zone {
            position: absolute;
            bottom: 24px;
            left: 24px;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 4px dashed rgba(15, 23, 42, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            color: rgba(15, 23, 42, 0.3);
            text-align: center;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div id="banner">
        <div class="noise"></div>
        <div class="glow-blob"></div>

        <!-- Fake Profile Picture Outline (For positioning only, remove before screenshot) -->
        <!-- <div class="profile-safe-zone">PROFILE PIC<br>SAFE ZONE</div> -->

        <!-- Logo -->
        <div class="absolute top-[40px] left-[40px] flex items-center z-20">
            <!-- Operzy Icon Replica -->
            <svg width="40" height="40" viewBox="0 0 100 100" class="mr-3" fill="none">
                <circle cx="50" cy="50" r="42" stroke="#A3E635" stroke-width="8" stroke-dasharray="200" stroke-linecap="round"/>
                <path d="M70 20 L85 35 M85 35 L70 50 M85 35 L50 35" stroke="#A3E635" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-45 50 50) translate(-10, -5)"/>
            </svg>
            <span class="font-sans font-extrabold text-[#0F172A] text-3xl tracking-tight">Operzy</span>
        </div>

        <!-- typography (Dead Center to avoid profile pic) -->
        <div class="absolute inset-0 flex flex-col items-center justify-center z-20 pl-20">
            <div class="w-[850px]">
                <h1 class="flex flex-col items-start mb-6">
                    <span class="font-sans font-extrabold text-[38px] leading-[1.1] tracking-tight text-primary mb-1">
                        Build an Agency Engineered to
                    </span>
                    <span class="font-drama italic font-bold text-[84px] leading-[0.95] tracking-tight text-accent glow-text">
                        Scale Without You.
                    </span>
                </h1>
                <div class="flex items-center">
                    <div class="w-3 h-3 rounded-full bg-accent mr-4 shadow-[0_0_10px_rgba(163,230,53,0.8)]"></div>
                    <span class="font-mono text-[18px] text-secondary tracking-[0.25em] relative top-0.5">
                        30-DAY DONE-FOR-YOU AGENCY AUTOMATION
                    </span>
                </div>
            </div>
        </div>

        <!-- Glass UI Abstract Graphics -->
        <div class="absolute right-12 top-12 bottom-12 w-[400px] z-10 flex flex-col gap-6 opacity-90 transform translate-x-10 scale-110">
            <!-- Main Dashboard Card -->
            <div class="w-full h-48 bg-white/70 backdrop-blur-xl border border-white/40 rounded-3xl p-6 shadow-glass flex flex-col relative overflow-hidden">
                <div class="absolute top-0 w-full h-[6px] bg-gradient-to-r from-accent to-[#BEF264] left-0"></div>
                <div class="flex items-center space-x-3 mb-6">
                    <div class="w-10 h-10 rounded-full bg-accent/20 border border-accent/40 flex flex-center items-center justify-center">
                        <div class="w-3 h-3 rounded-full bg-accent relative"><div class="absolute inset-0 bg-accent rounded-full animate-ping opacity-75"></div></div>
                    </div>
                    <div>
                        <div class="w-24 h-3 bg-secondary/20 rounded-full mb-2"></div>
                        <div class="w-16 h-2 bg-secondary/10 rounded-full"></div>
                    </div>
                </div>
                <!-- Mini Grid -->
                <div class="grid grid-cols-3 gap-3 flex-1">
                    <div class="bg-background/80 rounded-xl border border-white/50 relative overflow-hidden">
                        <div class="absolute bottom-0 left-0 w-full h-1/2 bg-accent/30 rounded-t-lg"></div>
                    </div>
                    <div class="bg-background/80 rounded-xl border border-white/50 relative overflow-hidden">
                        <div class="absolute bottom-0 left-0 w-full h-3/4 bg-accent/60 rounded-t-lg"></div>
                    </div>
                    <div class="bg-background/80 rounded-xl border border-white/50 flex flex-col p-2 space-y-2">
                        <div class="w-full h-1.5 bg-accent/20 rounded-full"></div>
                        <div class="w-2/3 h-1.5 bg-accent/20 rounded-full"></div>
                        <div class="w-full h-1.5 bg-accent/40 rounded-full"></div>
                    </div>
                </div>
            </div>

            <!-- Secondary Node Card -->
            <div class="w-[80%] h-24 bg-white/70 backdrop-blur-xl border border-white/40 rounded-2xl p-4 shadow-glass self-end flex items-center relative overflow-hidden">
                <div class="w-14 h-14 rounded-xl bg-primary flex items-center justify-center mr-4">
                    <div class="w-1 h-3 bg-accent rounded-full animate-[pulse_1s_infinite]"></div>
                </div>
                <div class="flex-1">
                    <div class="w-full h-2.5 bg-primary/10 rounded-full mb-3"></div>
                    <div class="w-1/2 h-2 bg-primary/5 rounded-full"></div>
                </div>
            </div>
            
            <!-- Connection Lines -->
            <svg class="absolute top-[80px] -left-[150px] w-[180px] h-[200px]" fill="none" stroke="url(#gradient)" stroke-width="4" stroke-dasharray="8 8">
                <defs>
                    <linearGradient id="gradient">
                        <stop offset="0%" stop-color="rgba(163,230,53,0)"/>
                        <stop offset="100%" stop-color="rgba(163,230,53,0.6)"/>
                    </linearGradient>
                </defs>
                <path d="M 0 100 C 80 100, 80 20, 180 20" stroke-linecap="round"/>
            </svg>

        </div>
    </div>

</body>
</html>
